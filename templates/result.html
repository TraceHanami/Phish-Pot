<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
        .container { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 800px; }
        .badge-phishing { color: #dc3545; font-weight: bold; }
        .badge-legitimate { color: #28a745; font-weight: bold; }
        .explanation { background: #eef2f7; padding: 15px; border-left: 4px solid #007bff; margin-top: 20px; border-radius: 4px; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .back-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            Prediction: 
            {% if prediction_label == 'Phishing' %}
                <span class="badge-phishing">🚨 Phishing Detected</span>
            {% else %}
                <span class="badge-legitimate">✅ Legitimate Website</span>
            {% endif %}
        </h2>
        
        <h3>🔍 Feature Influence (SHAP Plot)</h3>
        {% if plot_url %}
            <img src="{{ plot_url }}" alt="SHAP Feature Influence Plot" style="max-width:100%; border: 1px solid #ddd; border-radius: 4px;"/>
        {% endif %}
        
        <div class="explanation">
            <p><strong>🧠 Explanation:</strong> {{ explanation }}</p>
        </div>
        
        <a href="/form" class="back-btn">← Analyze Another Website</a>
    </div>
</body>
</html>
